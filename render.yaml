services:
  - type: web
    name: organizer-directory
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://organizer-directory.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: organizer-directory-db
          property: connectionString

databases:
  - name: organizer-directory-db
    plan: free
