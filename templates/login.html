<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reception Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(183, 121, 31, 0.08)), #f5f7fb;
      color: #17202a;
    }

    .auth-card {
      width: min(440px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    .auth-head {
      padding: 26px;
      color: #fff;
      background: #0f766e;
    }

    .auth-body {
      padding: 26px;
    }

    .form-control {
      min-height: 48px;
      border-radius: 8px;
    }

    .btn-primary {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: #0f766e;
      font-weight: 800;
    }

    .btn-primary:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-head">
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-shield-lock-fill fs-3"></i>
        <h1 class="h4 fw-bold mb-0">Reception Login</h1>
      </div>
      <p class="mb-0 opacity-75">Approved reception users can search organizer details.</p>
    </div>
    <div class="auth-body">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>
      {% endfor %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Name</label>
          <input type="text" name="name" id="name" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Login
        </button>
      </form>

      <div class="text-center mt-4">
        <span class="text-muted">Need access?</span>
        <a href="{% url 'directory:register' %}" class="fw-bold text-decoration-none">Register for approval</a>
      </div>
    </div>
  </main>
</body>
</html>
