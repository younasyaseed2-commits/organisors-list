<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.15), rgba(16, 42, 42, 0.08)), #f5f7fb;
    }

    .login-card {
      width: min(430px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    .login-head {
      padding: 26px;
      color: #fff;
      background: #102a2a;
    }

    .login-body {
      padding: 26px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-head">
      <h1 class="h4 fw-bold mb-1"><i class="bi bi-shield-lock me-1"></i> Admin Login</h1>
      <p class="mb-0 opacity-75">Custom data upload dashboard</p>
    </div>
    <div class="login-body">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>
      {% endfor %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold" for="username">Username</label>
          <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="password">Password</label>
          <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-success btn-lg w-100 fw-bold" type="submit">Login</button>
      </form>
    </div>
  </main>
</body>
</html>
